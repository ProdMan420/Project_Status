<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Status</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f11;
  --surf: #18181b;
  --surf2: #222226;
  --surf3: #2a2a2f;
  --bdr: rgba(255,255,255,0.08);
  --bdr2: rgba(255,255,255,0.16);
  --txt: #f0f0f2;
  --mut: #808088;
  --dim: #3a3a42;
}
[data-theme=light] {
  --bg: #f4f4f6;
  --surf: #ffffff;
  --surf2: #f0f0f4;
  --surf3: #e8e8ed;
  --bdr: rgba(0,0,0,0.09);
  --bdr2: rgba(0,0,0,0.18);
  --txt: #111113;
  --mut: #70707a;
  --dim: #c8c8d0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--txt); font-family: "DM Sans", sans-serif; font-size: 14px; }
.page { max-width: 1280px; margin: 0 auto; padding: 36px 24px 80px; }

/* header */
.hdr { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 32px; }
.hdr h1 { font-size: 24px; font-weight: 600; letter-spacing: -.3px; }
.hdr p { font-size: 12px; color: var(--mut); margin-top: 3px; }

/* theme */
.theme-row { display: flex; gap: 2px; background: var(--surf); border: 1px solid var(--bdr); border-radius: 9px; padding: 3px; }
.tbtn { display: flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 6px; border: none; background: transparent; color: var(--mut); font: 500 12px "DM Sans",sans-serif; cursor: pointer; }
.tbtn:hover { color: var(--txt); }
.tbtn.on { background: var(--surf2); color: var(--txt); border: 1px solid var(--bdr2); }
.tbtn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* stats */
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.stat { flex: 1; min-width: 80px; background: var(--surf); border: 1px solid var(--bdr); border-radius: 10px; padding: 12px 14px; }
.stat-n { font: 600 22px/1 "DM Mono",monospace; margin-bottom: 4px; }
.stat-l { font-size: 10px; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }

/* tabs */
.tabs { display: flex; gap: 3px; background: var(--surf); border: 1px solid var(--bdr); border-radius: 9px; padding: 3px; width: fit-content; margin-bottom: 16px; }
.tab { padding: 6px 16px; border-radius: 6px; border: none; background: transparent; color: var(--mut); font: 500 13px "DM Sans",sans-serif; cursor: pointer; }
.tab:hover { color: var(--txt); }
.tab.on { background: var(--surf2); color: var(--txt); border: 1px solid var(--bdr2); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 20px; }
.flbl { font-size: 11px; color: var(--mut); }
.fc { padding: 4px 11px; border-radius: 20px; border: 1px solid var(--bdr); background: transparent; color: var(--mut); font: 500 11px "DM Sans",sans-serif; cursor: pointer; }
.fc:hover { border-color: var(--bdr2); color: var(--txt); }
.fc.on { border-color: var(--ac); color: var(--ac); background: var(--ac-bg); }

/* cards */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surf); border: 1px solid var(--bdr); border-radius: 12px; overflow: hidden; }
.card-hdr { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none; }
.card-hdr:hover { background: var(--surf2); }
.cdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cname { font-size: 13px; font-weight: 600; flex: 1; }
.ccnt { font: 400 11px "DM Mono",monospace; color: var(--mut); }
.chev { color: var(--mut); transition: transform .2s; flex-shrink: 0; }
.card.open .chev { transform: rotate(180deg); }
.card-body { display: none; border-top: 1px solid var(--bdr); overflow-x: auto; }
.card.open .card-body { display: block; }

/* table */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th {
  padding: 8px 12px;
  text-align: left;
  font: 500 10px/1 "DM Sans",sans-serif;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: .06em;
  background: var(--surf2);
  border-bottom: 1px solid var(--bdr);
  white-space: nowrap;
}
td {
  padding: 9px 12px;
  font-size: 12px;
  vertical-align: middle;
  border-bottom: 1px solid var(--bdr);
  overflow: hidden;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); }
[data-theme=light] tr:hover td { background: rgba(0,0,0,.015); }

/* col widths */
.col-product { width: 13%; }
.col-mvp     { width: 7%;  }
.col-status  { width: 15%; }
.col-target  { width: 10%; }
.col-poc     { width: 22%; }
.col-comment { width: auto; }

/* status badge */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px;
  font: 600 11px "DM Sans",sans-serif;
  white-space: nowrap; border: 1px solid transparent;
  cursor: pointer;
}
.bdot { width: 5px; height: 5px; border-radius: 50%; }

/* poc pills */
.poc-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ppill {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 7px; border-radius: 20px;
  font: 500 11px "DM Sans",sans-serif;
  background: var(--surf3); border: 1px solid var(--bdr2); color: var(--txt);
}
.ppill button { background: none; border: none; color: var(--mut); font-size: 13px; line-height: 1; cursor: pointer; padding: 0 0 0 1px; }
.ppill button:hover { color: #f87171; }
.padd { width: 20px; height: 20px; border-radius: 50%; background: transparent; border: 1px dashed var(--bdr2); color: var(--mut); font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.padd:hover { border-color: #a78bfa; color: #a78bfa; }

/* editable cells */
td.ed { cursor: pointer; position: relative; }
td.ed:hover::after { content: "✎"; position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--dim); }
td.editing { padding: 4px 6px; background: var(--surf3); }

/* text input */
.ci { width: 100%; background: var(--surf); border: 1px solid var(--bdr2); border-radius: 6px; color: var(--txt); font: 400 13px "DM Sans",sans-serif; padding: 6px 9px; outline: none; }
.ci:focus { border-color: #a78bfa; }

/* date picker */
.dpick { background: var(--surf); border: 1px solid var(--bdr2); border-radius: 6px; color: var(--txt); font: 400 11px "DM Mono",monospace; padding: 5px 7px; outline: none; color-scheme: dark; max-width: 145px; display: block; }
[data-theme=light] .dpick { color-scheme: light; }
.dpick:focus { border-color: #a78bfa; }
.dtbd { margin-top: 5px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--bdr2); background: var(--surf); color: var(--mut); font: 500 11px "DM Sans",sans-serif; cursor: pointer; }
.dtbd:hover, .dtbd.on { background: rgba(100,116,139,.15); color: #94a3b8; border-color: #64748b; }

/* dropdown */
.dd {
  position: fixed; z-index: 9999;
  background: var(--surf); border: 1px solid var(--bdr2); border-radius: 10px;
  box-shadow: 0 12px 36px rgba(0,0,0,.5); min-width: 190px; overflow: hidden;
}
[data-theme=light] .dd { box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.dd-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font: 500 12px "DM Sans",sans-serif; color: var(--txt); }
.dd-item:hover { background: var(--surf2); }
.dd-item.ck::after { content: "✓"; margin-left: auto; color: #22c55e; font-size: 11px; }
.dd-sep { height: 1px; background: var(--bdr); }
.dd-new { display: flex; align-items: center; gap: 7px; padding: 7px 10px; }
.dd-new-btn { width: 20px; height: 20px; border-radius: 5px; background: var(--surf2); border: 1px solid var(--bdr2); color: var(--mut); font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dd-new-btn:hover { background: rgba(167,139,250,.15); color: #a78bfa; border-color: #a78bfa; }
.dd-inp { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--bdr2); color: var(--txt); font: 400 12px "DM Sans",sans-serif; padding: 2px 4px; outline: none; min-width: 0; }
.dd-inp:focus { border-bottom-color: #a78bfa; }
.dd-del { margin-left: auto; background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 0 2px; }
.dd-del:hover { color: #f87171; }

/* save flash */
@keyframes flash { 0% { background: rgba(34,197,94,.2); } 100% { background: transparent; } }
.flash { animation: flash .6s ease; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--bdr); background: var(--surf2); }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--mut); }
.ldot { width: 6px; height: 6px; border-radius: 50%; }

.empty { padding: 32px; text-align: center; color: var(--mut); font-size: 13px; }

/* add project */
.btn-add-proj { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; margin-top: 12px; padding: 9px 16px; border-radius: 10px; border: 1px dashed var(--bdr2); background: transparent; color: var(--mut); font: 500 13px "DM Sans",sans-serif; cursor: pointer; transition: all .15s; }
.btn-add-proj:hover { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,.07); }

/* add product row */
.add-product-row td { padding: 7px 12px; border-top: 1px dashed var(--bdr2); border-bottom: none !important; }
.btn-add-prod { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px; border: 1px dashed var(--bdr2); background: transparent; color: var(--mut); font: 500 11px "DM Sans",sans-serif; cursor: pointer; transition: all .15s; }
.btn-add-prod:hover { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,.07); }

/* delete buttons */
.btn-del-proj { background: none; border: none; color: var(--dim); font-size: 16px; cursor: pointer; padding: 2px 5px; border-radius: 4px; line-height: 1; transition: all .15s; flex-shrink: 0; }
.btn-del-proj:hover { color: #f87171; background: rgba(248,113,113,.1); }
.btn-del-row { background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 1px 5px; border-radius: 4px; opacity: 0; transition: all .15s; }
tr:hover .btn-del-row { opacity: 1; }
.btn-del-row:hover { color: #f87171; }

/* modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 99999; backdrop-filter: blur(3px); }
[data-theme=light] .modal-overlay { background: rgba(0,0,0,.25); }
.modal { background: var(--surf); border: 1px solid var(--bdr2); border-radius: 14px; padding: 28px; width: 360px; max-width: 92vw; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
[data-theme=light] .modal { box-shadow: 0 12px 32px rgba(0,0,0,.15); }
.modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.mfield { margin-bottom: 16px; }
.mfield label { display: block; font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.mfield input { width: 100%; background: var(--surf2); border: 1px solid var(--bdr2); border-radius: 7px; color: var(--txt); font: 400 14px "DM Sans",sans-serif; padding: 9px 12px; outline: none; }
.mfield input:focus { border-color: #a78bfa; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .12s, border-color .12s; }
.swatch:hover { transform: scale(1.15); }
.swatch.on { border-color: var(--txt); transform: scale(1.15); }
.mactions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
.btn-cancel { padding: 8px 16px; border-radius: 7px; border: 1px solid var(--bdr2); background: transparent; color: var(--mut); font: 500 13px "DM Sans",sans-serif; cursor: pointer; }
.btn-cancel:hover { color: var(--txt); }
.btn-ok { padding: 8px 18px; border-radius: 7px; border: none; background: #a78bfa; color: #fff; font: 600 13px "DM Sans",sans-serif; cursor: pointer; }
.btn-ok:hover { opacity: .85; }

/* ── SAVE / EXPORT / IMPORT ── */
.data-bar { display: flex; align-items: center; gap: 6px; }
.btn-data { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--bdr2); background: transparent; color: var(--mut); font: 500 12px "DM Sans",sans-serif; cursor: pointer; transition: all .15s; white-space: nowrap; }
.btn-data svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.btn-data:hover { color: var(--txt); border-color: var(--bdr2); background: var(--surf2); }
.btn-data.primary { background: #a78bfa; color: #fff; border-color: #a78bfa; }
.btn-data.primary:hover { opacity: .85; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; flex-shrink: 0; transition: background .3s; }
.save-dot.unsaved { background: #f59e0b; }
.save-dot.saved { background: #22c55e; }
.save-lbl { font-size: 11px; color: var(--mut); }
</style>
</head>
<body>
<div class="page">

  <div class="hdr">
    <div>
      <h1>Project Status</h1>
      <p>Click any cell to edit &nbsp;·&nbsp; June 2026</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="data-bar">
        <span class="save-dot" id="save-dot"></span>
        <span class="save-lbl" id="save-lbl">Saved</span>
        <button class="btn-data primary" onclick="saveNow()">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save
        </button>
        <button class="btn-data" onclick="exportJSON()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <button class="btn-data" onclick="document.getElementById('import-input').click()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import
        </button>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importJSON(this)">
      </div>
      <div class="theme-row">
        <button class="tbtn" id="t-light" onclick="setTheme('light')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg>
          Light
        </button>
        <button class="tbtn" id="t-dark" onclick="setTheme('dark')">
          <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          Dark
        </button>
        <button class="tbtn" id="t-system" onclick="setTheme('system')">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          System
        </button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats-box"></div>

  <div class="tabs">
    <button class="tab on" onclick="setMVP('mvp1',this)">MVP 1</button>
    <button class="tab"    onclick="setMVP('mvp2',this)">MVP 2</button>
    <button class="tab"    onclick="setMVP('all',this)">Both</button>
  </div>

  <div class="filters" id="filter-bar">
    <span class="flbl">Filter:</span>
    <button class="fc on" data-key="all" style="--ac:#888;--ac-bg:transparent" onclick="setFilter('all',this)">All</button>
  </div>

  <div class="cards" id="cards-box"></div>
  <button class="btn-add-proj" onclick="openAddProject()">+ Add Project</button>
  <div class="legend" id="legend-box"></div>

</div>

// ─── ACTIVE DROPDOWN ───────────────────────────────
var activeDD = null;
function closeDD() {
  if (activeDD) { activeDD.remove(); activeDD = null; }
}
document.addEventListener("click", function(e) {
  if (activeDD && !activeDD.contains(e.target)) closeDD();
});

// ─── DROPDOWN BUILDER ──────────────────────────────
// opts: [{key, label, col?, custom?}]
// sel: currently selected keys (array for multi, single string for single)
// onPick(key): called when item clicked
// multi: boolean
// onAdd(label) -> key: called to create new item
// onDel(key): optional, for custom items
function showDD(anchorEl, opts, sel, onPick, multi, onAdd, onDel, placeholder) {
  closeDD();
  var menu = document.createElement("div");
  menu.className = "dd";
  activeDD = menu;

  function build() {
    menu.innerHTML = "";
    opts.forEach(function(o) {
      var item = document.createElement("div");
      var isSelected = multi ? sel.indexOf(o.key) > -1 : sel === o.key;
      item.className = "dd-item" + (isSelected ? " ck" : "");
      var dot = o.col ? '<span style="width:7px;height:7px;border-radius:50%;background:'+o.col+';flex-shrink:0;display:inline-block"></span>' : "";
      item.innerHTML = dot + "<span>" + o.label + "</span>";
      if (onDel && o.custom) {
        var delBtn = document.createElement("button");
        delBtn.className = "dd-del"; delBtn.textContent = "×";
        delBtn.onclick = function(e) { e.stopPropagation(); onDel(o.key); build(); };
        item.appendChild(delBtn);
      }
      item.onclick = function(e) {
        e.stopPropagation();
        onPick(o.key);
        if (!multi) { closeDD(); }
        else { build(); }
      };
      menu.appendChild(item);
    });

    if (onAdd) {
      var sep = document.createElement("div"); sep.className = "dd-sep"; menu.appendChild(sep);
      var row = document.createElement("div"); row.className = "dd-new";
      var btn = document.createElement("button"); btn.className = "dd-new-btn"; btn.textContent = "+";
      var inp = document.createElement("input"); inp.className = "dd-inp"; inp.placeholder = placeholder || "Add new…"; inp.maxLength = 30;
      row.appendChild(btn); row.appendChild(inp); menu.appendChild(row);
      function doAdd() {
        var v = inp.value.trim(); if (!v) { inp.focus(); return; }
        var newKey = onAdd(v);
        onPick(newKey);
        if (!multi) { closeDD(); } else { inp.value = ""; build(); }
      }
      btn.onclick = function(e) { e.stopPropagation(); doAdd(); };
      inp.onclick = function(e) { e.stopPropagation(); };
      inp.onkeydown = function(e) {
        if (e.key === "Enter") { e.stopPropagation(); doAdd(); }
        if (e.key === "Escape") { e.stopPropagation(); closeDD(); }
      };
    }
  }
  build();

  document.body.appendChild(menu);
  var r = anchorEl.getBoundingClientRect();
  var mw = Math.max(210, r.width);
  var mh = menu.offsetHeight || 300;

  // horizontal: align to left edge of anchor, flip left if it overflows viewport
  var left = r.left;
  if (left + mw > window.innerWidth - 8) left = Math.max(8, r.right - mw);

  // vertical: open downward by default, flip upward if not enough space below
  var spaceBelow = window.innerHeight - r.bottom - 6;
  var spaceAbove = r.top - 6;
  var top;
  if (spaceBelow >= mh || spaceBelow >= spaceAbove) {
    top = r.bottom + 4;
  } else {
    top = r.top - mh - 4;
  }

  menu.style.left = left + "px";
  menu.style.top  = top + "px";
  menu.style.minWidth = mw + "px";
}

// ─── HELPERS ───────────────────────────────────────
function fmtDate(d) {
  if (!d || d === "TBD") return "TBD";
  var dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

function makeBadge(key) {
  var s = getStat(key);
  var span = document.createElement("span");
  span.className = "badge";
  span.style.background = s.bg;
  span.style.color = s.col;
  span.style.borderColor = s.col + "44";
  span.innerHTML = '<span class="bdot" style="background:' + s.col + '"></span>' + s.label;
  return span;
}

function flash(el) {
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

// ─── CELL EDITORS ──────────────────────────────────

function editText(td, getter, setter) {
  var cur = getter();
  td.className = "editing";
  var inp = document.createElement("input");
  inp.className = "ci"; inp.value = cur;
  td.innerHTML = "";
  td.appendChild(inp);
  inp.focus(); inp.select();

  function save() {
    var v = inp.value.trim() || cur;
    setter(v);
    renderCell_text(td, getter, setter);
    flash(td);
  }
  inp.onblur = save;
  inp.onkeydown = function(e) {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { setter(cur); renderCell_text(td, getter, setter); }
  };
}

function renderCell_text(td, getter, setter) {
  td.className = "ed";
  td.innerHTML = "";
  var span = document.createElement("span");
  span.textContent = getter() || "—";
  td.appendChild(span);
  td.onclick = function() { editText(td, getter, setter); };
}

function renderCell_product(td, getter, setter) {
  td.className = "ed";
  td.style.fontWeight = "500";
  td.style.fontSize = "13px";
  td.innerHTML = "";
  var span = document.createElement("span");
  span.textContent = getter();
  td.appendChild(span);
  td.onclick = function() { editText(td, getter, setter); };
}

function renderCell_status(td, getter, setter) {
  td.className = "ed";
  td.innerHTML = "";
  td.appendChild(makeBadge(getter()));
  td.onclick = function(e) {
    e.stopPropagation();
    showDD(
      td,
      STATUSES,
      getter(),
      function(key) {
        setter(key);
        renderCell_status(td, getter, setter);
        flash(td);
        drawStats();
      },
      false,
      function(label) {
        var key = "cx_" + Date.now();
        var col = CPAL[cpalIdx++ % CPAL.length];
        STATUSES.push({ key:key, label:label, col:col, bg:col+"22", custom:true });
        syncFilterBar();
        syncLegend();
        return key;
      },
      function(key) {
        for (var i=0;i<STATUSES.length;i++) if(STATUSES[i].key===key){ STATUSES.splice(i,1); break; }
        syncFilterBar(); syncLegend();
      },
      "New status…"
    );
  };
}

function renderCell_target(td, getter, setter) {
  td.className = "ed";
  var cur = getter();
  td.innerHTML = "";
  var span = document.createElement("span");
  span.style.fontFamily = '"DM Mono",monospace';
  span.style.fontSize = "11px";
  span.style.color = "var(--mut)";
  span.textContent = fmtDate(cur);
  td.appendChild(span);
  td.onclick = function() { openTargetEditor(td, getter, setter); };
}

function openTargetEditor(td, getter, setter) {
  var cur = getter();
  td.className = "editing";
  td.innerHTML = "";
  var inp = document.createElement("input");
  inp.type = "date"; inp.className = "dpick";
  if (cur && cur !== "TBD") inp.value = cur;
  var tbdBtn = document.createElement("button");
  tbdBtn.className = "dtbd" + ((!cur || cur==="TBD") ? " on" : "");
  tbdBtn.textContent = "Set as TBD";
  td.appendChild(inp); td.appendChild(tbdBtn);
  inp.focus();

  function save(val) {
    setter(val);
    renderCell_target(td, getter, setter);
    flash(td);
  }
  inp.onchange = function() { if (inp.value) save(inp.value); };
  inp.onkeydown = function(e) { if(e.key==="Escape") { setter(cur); renderCell_target(td,getter,setter); } };
  tbdBtn.onclick = function() { save("TBD"); };
  inp.onblur = function() {
    setTimeout(function() {
      if (!td.contains(document.activeElement)) save(inp.value || cur);
    }, 150);
  };
}

function renderCell_poc(td, getter, setter) {
  td.className = "ed";
  td.innerHTML = "";
  var wrap = document.createElement("div"); wrap.className = "poc-wrap";
  var current = getter();

  current.forEach(function(name, ni) {
    var pill = document.createElement("span"); pill.className = "ppill";
    pill.textContent = name;
    var xBtn = document.createElement("button"); xBtn.textContent = "×";
    xBtn.onclick = function(e) {
      e.stopPropagation();
      current.splice(ni, 1);
      setter(current.slice());
      renderCell_poc(td, getter, setter);
      flash(td);
    };
    pill.appendChild(xBtn);
    wrap.appendChild(pill);
  });

  var addBtn = document.createElement("button"); addBtn.className = "padd"; addBtn.textContent = "+";
  addBtn.onclick = function(e) {
    e.stopPropagation();
    showDD(
      addBtn,
      POC_LIST.map(function(n) { return {key:n, label:n}; }),
      current,
      function(name) {
        var arr = getter();
        if (arr.indexOf(name) === -1) { arr.push(name); setter(arr); }
        renderCell_poc(td, getter, setter);
        flash(td);
      },
      true,
      function(name) {
        if (POC_LIST.indexOf(name) === -1) POC_LIST.push(name);
        return name;
      },
      null,
      "Add person…"
    );
  };
  wrap.appendChild(addBtn);
  td.appendChild(wrap);
  td.onclick = function(e) {
    if (!e.target.closest(".padd") && !e.target.closest(".ppill")) {
      addBtn.click();
    }
  };
}

function renderCell_comment(td, getter, setter) {
  td.className = "ed";
  td.innerHTML = "";
  var span = document.createElement("span");
  span.style.fontSize = "12px";
  span.style.color = "var(--mut)";
  var v = getter();
  if (v) { span.style.fontStyle = "italic"; span.textContent = v; }
  else { span.style.opacity = ".35"; span.textContent = "—"; }
  td.appendChild(span);
  td.onclick = function() { editText(td, getter, setter); };
}

// ─── STATS ─────────────────────────────────────────
function drawStats() {
  var total=0, rel=0, des=0, act=0, tbd=0;
  DATA.forEach(function(proj) {
    getRows(proj).forEach(function(r) {
      if (curFilter === "all" || r.status === curFilter) {
        total++;
        if (r.status==="released")  rel++;
        if (r.status==="designing") des++;
        if (r.status==="inprogress"||r.status==="todo") act++;
        if (r.status==="tbd") tbd++;
      }
    });
  });
  document.getElementById("stats-box").innerHTML =
    stat(total,"Modules","var(--txt)") +
    stat(rel,"Released","#22c55e") +
    stat(des,"Designing","#a78bfa") +
    stat(act,"Active","#38bdf8") +
    stat(tbd,"TBD","#64748b");
}
function stat(n,l,c) {
  return '<div class="stat"><div class="stat-n" style="color:'+c+'">'+n+'</div><div class="stat-l">'+l+'</div></div>';
}

// ─── FILTER BAR ────────────────────────────────────
function syncFilterBar() {
  var bar = document.getElementById("filter-bar");
  STATUSES.forEach(function(s) {
    if (bar.querySelector('[data-key="'+s.key+'"]')) return;
    var btn = document.createElement("button");
    btn.className = "fc"; btn.dataset.key = s.key; btn.textContent = s.label;
    btn.style.setProperty("--ac", s.col);
    btn.style.setProperty("--ac-bg", s.bg);
    btn.onclick = function() { setFilter(s.key, btn); };
    bar.appendChild(btn);
  });
}

function syncLegend() {
  document.getElementById("legend-box").innerHTML = STATUSES.map(function(s) {
    return '<div class="leg"><span class="ldot" style="background:'+s.col+'"></span>'+s.label+'</div>';
  }).join("");
}

// ─── ROWS ───────────────────────────────────────────
function getRows(proj) {
  function tag(arr, mvpKey, lbl) {
    return arr.map(function(r,i){ return Object.assign({}, r, {_proj:proj.id, _mvp:mvpKey, _idx:i, _lbl:lbl}); });
  }
  if (curMVP==="mvp1") return tag(proj.mvp1, "mvp1", "MVP1");
  if (curMVP==="mvp2") return tag(proj.mvp2, "mvp2", "MVP2");
  return tag(proj.mvp1,"mvp1","MVP1").concat(tag(proj.mvp2,"mvp2","MVP2"));
}

function getRecord(projId, mvpKey, idx) {
  for (var i=0;i<DATA.length;i++) if(DATA[i].id===projId) return DATA[i][mvpKey][idx];
}

// ─── MAIN RENDER ───────────────────────────────────
function render() {
  drawStats();
  syncFilterBar();
  syncLegend();

  var container = document.getElementById("cards-box");
  var open = {};
  container.querySelectorAll(".card").forEach(function(c){ open[c.dataset.id] = c.classList.contains("open"); });
  container.innerHTML = "";

  var showMVP = (curMVP === "all");

  DATA.forEach(function(proj) {
    var rows = getRows(proj);
    var filtered = curFilter==="all" ? rows : rows.filter(function(r){ return r.status===curFilter; });
    if (!filtered.length) return;

    var card = document.createElement("div");
    card.className = "card" + (open[proj.id]!==false ? " open" : "");
    card.dataset.id = proj.id;

    // card header
    var hdr = document.createElement("div"); hdr.className = "card-hdr";
    hdr.innerHTML = '<span class="cdot" style="background:'+proj.color+'"></span>'
      + '<span class="cname">'+proj.name+'</span>'
      + '<span class="ccnt">'+filtered.length+' module'+(filtered.length!==1?"s":"")+'</span>'
      + '<button class="btn-del-proj" title="Delete project">&#x2715;</button>'
      + '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    hdr.onclick = function() { card.classList.toggle("open"); };
    // wire delete — must stop propagation so it doesn't toggle card
    (function(pid){ hdr.querySelector(".btn-del-proj").onclick = function(e){ e.stopPropagation(); deleteProject(pid); }; })(proj.id);
    card.appendChild(hdr);

    // card body
    var body = document.createElement("div"); body.className = "card-body";

    var tbl = document.createElement("table");
    // colgroup
    var cg = '<colgroup>'
      + '<col style="width:13%">'
      + (showMVP ? '<col style="width:7%">' : '')
      + '<col style="width:15%">'
      + '<col style="width:10%">'
      + '<col style="width:22%">'
      + '<col>'
      + '</colgroup>';
    var th = '<thead><tr>'
      + '<th>Product</th>'
      + (showMVP ? '<th>MVP</th>' : '')
      + '<th>Status</th>'
      + '<th>Target</th>'
      + '<th>POC</th>'
      + '<th>Comments</th>'
      + '</tr></thead>';
    tbl.innerHTML = cg + th;

    var tbody = document.createElement("tbody");
    filtered.forEach(function(r) {
      var tr = document.createElement("tr");
      var rec = getRecord(r._proj, r._mvp, r._idx);

      // product
      var tdP = document.createElement("td");
      renderCell_product(tdP,
        function(){ return rec.product; },
        function(v){ rec.product = v; }
      );
      tr.appendChild(tdP);

      // mvp label
      if (showMVP) {
        var tdM = document.createElement("td");
        tdM.style.fontFamily = '"DM Mono",monospace';
        tdM.style.fontSize = "11px";
        tdM.style.color = "var(--mut)";
        tdM.textContent = r._lbl;
        tr.appendChild(tdM);
      }

      // status
      var tdS = document.createElement("td");
      renderCell_status(tdS,
        function(){ return rec.status; },
        function(v){ rec.status = v; }
      );
      tr.appendChild(tdS);

      // target
      var tdT = document.createElement("td");
      renderCell_target(tdT,
        function(){ return rec.target; },
        function(v){ rec.target = v; }
      );
      tr.appendChild(tdT);

      // poc
      var tdPOC = document.createElement("td");
      renderCell_poc(tdPOC,
        function(){ return rec.poc; },
        function(v){ rec.poc = v; }
      );
      tr.appendChild(tdPOC);

      // comment
      var tdC = document.createElement("td");
      renderCell_comment(tdC,
        function(){ return rec.comment; },
        function(v){ rec.comment = v; }
      );
      tr.appendChild(tdC);

      // delete row button (last cell)
      var tdDel = document.createElement("td");
      tdDel.style.width = "32px";
      tdDel.style.padding = "0 6px";
      tdDel.style.textAlign = "center";
      (function(pid, mk, ridx){
        var delBtn = document.createElement("button");
        delBtn.className = "btn-del-row";
        delBtn.title = "Delete product";
        delBtn.textContent = "✕";
        delBtn.onclick = function(e){ e.stopPropagation(); deleteProduct(pid, mk, ridx); };
        tdDel.appendChild(delBtn);
      })(r._proj, r._mvp, r._idx);
      tr.appendChild(tdDel);

      tbody.appendChild(tr);
    });

    // ── Add Product row ──
    (function(pid){
      var addRow = document.createElement("tr");
      addRow.className = "add-product-row";
      var addTd = document.createElement("td");
      addTd.colSpan = showMVP ? 7 : 6;
      var addBtn = document.createElement("button");
      addBtn.className = "btn-add-prod";
      addBtn.innerHTML = "+ Add Product";
      addBtn.onclick = function(){ addProduct(pid); };
      addTd.appendChild(addBtn);
      addRow.appendChild(addTd);
      tbody.appendChild(addRow);
    })(proj.id);

    tbl.appendChild(tbody);
    body.appendChild(tbl);
    card.appendChild(body);
    container.appendChild(card);
  });

  if (!container.children.length)
    container.innerHTML = '<div class="empty">No modules match this filter.</div>';
}

// ─── CONTROLS ──────────────────────────────────────
function setMVP(mvp, el) {
  curMVP = mvp;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("on"); });
  el.classList.add("on");
  render();
}

function setFilter(key, el) {
  curFilter = key;
  document.querySelectorAll(".fc").forEach(function(c){
    c.classList.remove("on");
    c.style.removeProperty("border-color");
    c.style.removeProperty("color");
    c.style.removeProperty("background-color");
  });
  el.classList.add("on");
  if (key !== "all") {
    var s = getStat(key);
    el.style.borderColor = s.col;
    el.style.color = s.col;
    el.style.backgroundColor = s.bg;
  }
  render();
}

function setTheme(mode) {
  var sysDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
  var root = document.documentElement;
  if (mode==="light") root.setAttribute("data-theme","light");
  else if (mode==="dark") root.removeAttribute("data-theme");
  else { sysDark ? root.removeAttribute("data-theme") : root.setAttribute("data-theme","light"); }
  localStorage.setItem("theme", mode);
  document.querySelectorAll(".tbtn").forEach(function(b){ b.classList.remove("on"); });
  var btn = document.getElementById("t-"+mode);
  if (btn) btn.classList.add("on");
}

// ─── ADD / DELETE PROJECT ──────────────────────────
var PROJECT_COLORS = ["#a78bfa","#34d399","#fb923c","#f472b6","#38bdf8","#facc15","#f87171","#60a5fa","#e879f9","#a3e635"];
var projColorIdx = PROJECT_COLORS.length; // start after existing 5

function openAddProject() {
  var picked = PROJECT_COLORS[projColorIdx % PROJECT_COLORS.length];

  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  var swatchHTML = PROJECT_COLORS.map(function(c) {
    return '<span class="swatch' + (c === picked ? ' on' : '') + '" style="background:' + c + '" data-c="' + c + '"></span>';
  }).join("");

  overlay.innerHTML = '<div class="modal">'
    + '<h2>Add New Project</h2>'
    + '<div class="mfield"><label>Project Name</label><input id="mp-name" type="text" placeholder="e.g. Y-Payments" autocomplete="off"></div>'
    + '<div class="mfield"><label>Colour</label><div class="swatches" id="mp-swatches">' + swatchHTML + '</div></div>'
    + '<div class="mactions">'
    + '<button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>'
    + '<button class="btn-ok" id="mp-ok">Add Project</button>'
    + '</div></div>';

  document.body.appendChild(overlay);

  var nameInp = overlay.querySelector("#mp-name");
  nameInp.focus();

  // swatch picker
  overlay.querySelector("#mp-swatches").onclick = function(e) {
    var sw = e.target.closest(".swatch");
    if (!sw) return;
    overlay.querySelectorAll(".swatch").forEach(function(s){ s.classList.remove("on"); });
    sw.classList.add("on");
    picked = sw.dataset.c;
  };

  overlay.querySelector("#mp-ok").onclick = function() {
    var name = nameInp.value.trim();
    if (!name) { nameInp.focus(); nameInp.style.borderColor = "#f87171"; return; }
    var id = "proj_" + Date.now();
    DATA.push({ id: id, name: name, color: picked,
      mvp1: [], mvp2: [] });
    projColorIdx++;
    overlay.remove();
    markUnsaved();
    render();
    // auto-open new card and scroll to it
    var newCard = document.querySelector('.card[data-id="' + id + '"]');
    if (newCard) { newCard.classList.add("open"); newCard.scrollIntoView({ behavior:"smooth", block:"center" }); }
  };

  nameInp.onkeydown = function(e) { if (e.key === "Enter") overlay.querySelector("#mp-ok").click(); };
}

function deleteProject(projId) {
  if (!confirm("Delete this project and all its products?")) return;
  DATA = DATA.filter(function(p){ return p.id !== projId; });
  markUnsaved();
  render();
}

// ─── ADD / DELETE PRODUCT ──────────────────────────
function addProduct(projId) {
  var proj = null;
  for (var i=0;i<DATA.length;i++) if(DATA[i].id===projId){ proj=DATA[i]; break; }
  if (!proj) return;
  var blank = { product:"New Product", status:"tbd", target:"TBD", poc:[], comment:"" };
  proj.mvp1.push(Object.assign({}, blank));
  proj.mvp2.push(Object.assign({}, blank));
  markUnsaved();
  render();
  // focus the new product name cell for immediate editing
  var card = document.querySelector('.card[data-id="'+projId+'"]');
  if (card) {
    card.classList.add("open");
    var rows = card.querySelectorAll("tbody tr:not(.add-product-row)");
    var lastRow = rows[rows.length - 1];
    if (lastRow) {
      var firstTd = lastRow.querySelector("td.ed");
      if (firstTd) setTimeout(function(){ firstTd.click(); }, 50);
    }
  }
}

function deleteProduct(projId, mvpKey, idx) {
  var proj = null;
  for (var i=0;i<DATA.length;i++) if(DATA[i].id===projId){ proj=DATA[i]; break; }
  if (!proj) return;
  // delete from both mvp1 and mvp2 by matching index
  proj.mvp1.splice(idx, 1);
  proj.mvp2.splice(idx, 1);
  markUnsaved();
  render();
}

// ─── PERSISTENCE ───────────────────────────────────
var STORAGE_KEY = "project_status_data_v1";
var saveTimer = null;

function markUnsaved() {
  var dot = document.getElementById("save-dot");
  var lbl = document.getElementById("save-lbl");
  if (dot) { dot.className = "save-dot unsaved"; }
  if (lbl) { lbl.textContent = "Unsaved changes"; }
  // auto-save after 2 seconds of inactivity
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 2000);
}

function saveNow() {
  clearTimeout(saveTimer);
  try {
    var snapshot = {
      data: DATA,
      statuses: STATUSES,
      pocList: POC_LIST,
      savedAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    var dot = document.getElementById("save-dot");
    var lbl = document.getElementById("save-lbl");
    if (dot) { dot.className = "save-dot saved"; }
    if (lbl) { lbl.textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
    // fade back to neutral after 3s
    setTimeout(function() {
      if (dot) dot.className = "save-dot";
      if (lbl) lbl.textContent = "Saved";
    }, 3000);
  } catch(e) {
    alert("Could not save: " + e.message);
  }
}

function loadFromStorage() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    var snapshot = JSON.parse(raw);
    if (snapshot.data)     DATA      = snapshot.data;
    if (snapshot.statuses) STATUSES  = snapshot.statuses;
    if (snapshot.pocList)  POC_LIST  = snapshot.pocList;
    return true;
  } catch(e) {
    return false;
  }
}

function exportJSON() {
  var snapshot = {
    data: DATA,
    statuses: STATUSES,
    pocList: POC_LIST,
    exportedAt: new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "project-status-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importJSON(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var snapshot = JSON.parse(e.target.result);
      if (!snapshot.data || !Array.isArray(snapshot.data)) {
        alert("Invalid file — no project data found."); return;
      }
      if (!confirm("This will replace all current data with the imported file. Continue?")) {
        input.value = ""; return;
      }
      DATA     = snapshot.data;
      STATUSES = snapshot.statuses || STATUSES;
      POC_LIST = snapshot.pocList  || POC_LIST;
      input.value = "";
      saveNow();
      render();
      document.querySelectorAll(".card").forEach(function(c){ c.classList.add("open"); });
    } catch(err) {
      alert("Could not read file: " + err.message);
    }
  };
  reader.readAsText(file);
}

// Patch markUnsaved into every setter so edits auto-trigger save
var _origRenderCell_product = renderCell_product;
renderCell_product = function(td, getter, setter) {
  _origRenderCell_product(td, getter, function(v){ setter(v); markUnsaved(); });
};
var _origRenderCell_status = renderCell_status;
renderCell_status = function(td, getter, setter) {
  _origRenderCell_status(td, getter, function(v){ setter(v); markUnsaved(); });
};
var _origRenderCell_target = renderCell_target;
renderCell_target = function(td, getter, setter) {
  _origRenderCell_target(td, getter, function(v){ setter(v); markUnsaved(); });
};
var _origRenderCell_poc = renderCell_poc;
renderCell_poc = function(td, getter, setter) {
  _origRenderCell_poc(td, getter, function(v){ setter(v); markUnsaved(); });
};
var _origRenderCell_comment = renderCell_comment;
renderCell_comment = function(td, getter, setter) {
  _origRenderCell_comment(td, getter, function(v){ setter(v); markUnsaved(); });
};

// ─── BOOT ──────────────────────────────────────────
setTheme(localStorage.getItem("theme") || "system");
loadFromStorage();
render();
document.querySelectorAll(".card").forEach(function(c){ c.classList.add("open"); });
</script>
